<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5A0"/>
      <stop offset="50%" stop-color="#B8944F"/>
      <stop offset="100%" stop-color="#8C6A28"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142646"/>
      <stop offset="100%" stop-color="#0A1830"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Inner Subtle Border -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#B8944F" stroke-width="0.75" stroke-opacity="0.4"/>
  
  <!-- Monogram "RM" in Fraunces / Executive Serif Style -->
  <text x="32" y="41" font-family="'Fraunces', 'Georgia', serif" font-size="25" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">RM</text>
  
  <!-- Executive Diamond Accent -->
  <polygon points="32,12 34.5,15 32,18 29.5,15" fill="#E8D5A0"/>
</svg>
